aid: atlascard
name: Atlas Card
description: >-
  Atlas is a technology company (not a bank) that offers an invite-only luxury
  lifestyle membership built around a premium metal charge card, issued by Lead
  Bank. Membership pairs a CNC-milled steel Atlas Card with no preset spending
  limit and a concierge-driven mobile app that delivers curated restaurant
  reservations, luxury hotel bookings, access to sold-out concerts and sporting
  events, points-based travel rewards, and thousands of dollars in annual travel
  and lifestyle credits. Atlas Card is a consumer fintech product with a full
  monthly-payment charge structure and an annual membership fee; it does not
  publish a public developer API. Added to the API Evangelist network as a
  portfolio company of Kindred Ventures and enriched with the identity,
  well-known discovery, and domain-security surface it exposes publicly.
